name: Clip Farm

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Post one clip to YouTube right now"
        type: boolean
        default: false

concurrency:
  group: clip-farm
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pending: ${{ steps.tick.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: tick
        name: Discover + publish + cleanup
        run: python -m worker.tick
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '' }}

  process:
    needs: tick
    if: needs.tick.outputs.pending != '' && needs.tick.outputs.pending != '0'
    runs-on: ${{ vars.PROCESS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + fonts
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -1
      - name: Install Deno (yt-dlp needs a JS runtime for YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install yt-dlp
        run: python -m pip install --upgrade -r requirements.txt
      - name: Load YouTube cookies (optional)
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s\n' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YTDLP_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "cookies loaded"
          else
            echo "no cookies secret set"
          fi
      - name: Find moments, clip, render
        run: python -m worker.process
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
      - name: Remove cookies
        if: always()
        run: rm -f "$RUNNER_TEMP/cookies.txt"
